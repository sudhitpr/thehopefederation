<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Community Hope Portal</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            max-width: 600px;
            padding: 2.5rem;
            background: rgba(30, 41, 59, 0.7);
            border-radius: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }
        h1 { font-size: 2.25rem; margin-bottom: 0.75rem; color: #38bdf8; }
        p { color: #94a3b8; line-height: 1.6; margin-bottom: 2rem; }
        .links { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-primary { background: #0284c7; color: white; }
        .btn-primary:hover { background: #0369a1; }
        .btn-outline { border: 1px solid #475569; color: #e2e8f0; }
        .btn-outline:hover { background: #334155; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hope & Care Community</h1>
        <p>Serving our community through volunteers, strategic partnerships, and confidential prayer support.</p>
        <div class="links">
            <a href="/register" class="btn btn-primary">Join as Volunteer / Partner</a>
            <a href="/prayer-request" class="btn btn-outline">Submit Prayer Request</a>
            <a href="/admin/login" class="btn btn-outline">Admin Portal</a>
        </div>
    </div>
</body>
</html>
