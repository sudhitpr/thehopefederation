{% extends "base.html" %}

{% block title %}Page Not Found - 404{% endblock %}
{% block page_title %}Page Not Found{% endblock %}

{% block content %}
<div class="card" style="text-align: center; max-width: 500px; margin: 3rem auto; padding: 3rem 2rem;">
    <div style="font-size: 3rem; margin-bottom: 1rem;">🔍</div>
    <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem; color: #38bdf8;">404 - Not Found</h2>
    <p style="color: var(--text-secondary); margin-bottom: 1.5rem;">
        The requested admin page or record could not be found.
    </p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">Return to Dashboard</a>
</div>
{% endblock %}
