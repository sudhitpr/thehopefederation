{% extends "base.html" %}

{% block title %}Access Denied - 403{% endblock %}
{% block page_title %}Access Denied{% endblock %}

{% block content %}
<div class="card" style="text-align: center; max-width: 500px; margin: 3rem auto; padding: 3rem 2rem;">
    <div style="font-size: 3rem; margin-bottom: 1rem;">🔒</div>
    <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem; color: #fb7185;">403 - Forbidden</h2>
    <p style="color: var(--text-secondary); margin-bottom: 1.5rem;">
        You do not have administrative permission to view this resource or perform this action.
    </p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">Return to Dashboard</a>
</div>
{% endblock %}
